<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>New message from the Larchwick contact form</title>
  </head>
  <body style="margin: 0; padding: 0; background-color: #f7f1e8">
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="background-color: #f7f1e8"
    >
      <tr>
        <td align="center" style="padding: 32px 16px">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="
              max-width: 600px;
              background-color: #fffcf7;
              border: 1px solid #e2d6c6;
              border-radius: 4px;
            "
          >
            <tr>
              <td style="background-color: #2a1e17; padding: 24px 32px; border-radius: 4px 4px 0 0">
                <p
                  style="
                    margin: 0;
                    font-family: Georgia, 'Times New Roman', serif;
                    font-size: 26px;
                    color: #fffcf7;
                  "
                >
                  Larchwick
                </p>
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding: 32px;
                  font-family: Arial, Helvetica, sans-serif;
                  font-size: 16px;
                  line-height: 1.6;
                  color: #4a3f38;
                "
              >
                <h1
                  style="
                    margin: 0 0 24px;
                    font-family: Georgia, 'Times New Roman', serif;
                    font-size: 24px;
                    font-weight: normal;
                    color: #3b2a20;
                  "
                >
                  New message from the contact form
                </h1>
                <table
                  role="presentation"
                  width="100%"
                  cellpadding="0"
                  cellspacing="0"
                  style="font-size: 15px"
                >
                  <tr>
                    <td
                      style="
                        padding: 8px 0;
                        width: 90px;
                        color: #3b2a20;
                        font-weight: bold;
                        vertical-align: top;
                      "
                    >
                      Name
                    </td>
                    <td style="padding: 8px 0">{{{NAME}}}</td>
                  </tr>
                  <tr>
                    <td
                      style="padding: 8px 0; color: #3b2a20; font-weight: bold; vertical-align: top"
                    >
                      Email
                    </td>
                    <td style="padding: 8px 0">
                      <a href="mailto:{{{SENDER_EMAIL}}}" style="color: #9a5420"
                        >{{{SENDER_EMAIL}}}</a
                      >
                    </td>
                  </tr>
                  <tr>
                    <td
                      style="padding: 8px 0; color: #3b2a20; font-weight: bold; vertical-align: top"
                    >
                      Subject
                    </td>
                    <td style="padding: 8px 0">{{{SUBJECT}}}</td>
                  </tr>
                </table>
                <div
                  style="
                    margin-top: 24px;
                    padding: 16px 20px;
                    background-color: #f7f1e8;
                    border-left: 4px solid #c8743a;
                  "
                >
                  {{{MESSAGE}}}
                </div>
                <p style="margin: 24px 0 0; font-size: 14px">
                  Reply to this email to answer {{{NAME}}} directly.
                </p>
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding: 16px 32px;
                  border-top: 1px solid #e2d6c6;
                  font-family: Arial, Helvetica, sans-serif;
                  font-size: 12px;
                  color: #4a3f38;
                "
              >
                Sent by the contact form on the Larchwick website. Demo project — fictional
                business.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
